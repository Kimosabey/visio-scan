<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="VisioScan — Light Studio">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fff8f3"/>
      <stop offset="100%" stop-color="#f0e6dc"/>
    </linearGradient>
    <radialGradient id="flare1" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(190,24,93,0.22)"/>
      <stop offset="100%" stop-color="rgba(190,24,93,0)"/>
    </radialGradient>
    <radialGradient id="flare2" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="rgba(180,83,9,0.18)"/>
      <stop offset="100%" stop-color="rgba(180,83,9,0)"/>
    </radialGradient>
    <pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="rgba(28,25,23,0.05)"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grain)"/>
  <circle cx="1050" cy="80"  r="240" fill="url(#flare1)"/>
  <circle cx="80"   cy="280" r="200" fill="url(#flare2)"/>
  <!-- Aperture dial -->
  <g transform="translate(190 160)">
    <circle r="100" fill="#fffdf8" stroke="#9d174d" stroke-width="1"/>
    <g fill="none" stroke="#9d174d" stroke-width="2">
      <path d="M0 -94 L62 -54 L62 56 L0 96 L-62 56 L-62 -54 Z" opacity="0.5"/>
    </g>
    <circle r="22" fill="#1c1917"/>
    <circle r="6"  fill="#be185d"/>
    <text y="-60" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#9d174d" letter-spacing="2">f/2.8</text>
  </g>
  <!-- Polaroid stack -->
  <g transform="translate(940 60)">
    <g transform="rotate(-4)">
      <rect width="180" height="220" fill="#fffdf8" stroke="#f0e6dc" stroke-width="1"/>
      <rect x="12" y="12" width="156" height="156" fill="#1c1917" opacity="0.85"/>
      <text x="90" y="200" text-anchor="middle" font-family="Fraunces,serif" font-size="12" font-style="italic" fill="#44403c">field 2026-05-18</text>
    </g>
    <g transform="translate(60 30) rotate(3)">
      <rect width="180" height="220" fill="#fffdf8" stroke="#f0e6dc" stroke-width="1"/>
      <rect x="12" y="12" width="156" height="156" fill="#be185d" opacity="0.75"/>
      <text x="90" y="200" text-anchor="middle" font-family="Fraunces,serif" font-size="12" font-style="italic" fill="#44403c">reference</text>
    </g>
  </g>
  <!-- Brand -->
  <g transform="translate(330 110)">
    <text font-family="JetBrains Mono,monospace" font-size="13" font-weight="700" fill="#9d174d" letter-spacing="6">SELFAWARE — STUDIO V</text>
    <text y="74" font-family="Fraunces,serif" font-size="78" font-weight="700" fill="#1c1917" letter-spacing="-1">VisioScan</text>
    <text y="120" font-family="Inter,sans-serif" font-size="22" fill="#44403c">Compare-and-critique studio · drawings · panels · field photos</text>
    <text y="156" font-family="JetBrains Mono,monospace" font-size="14" fill="#9d174d" letter-spacing="2">:8105  ·  Ollama vision  ·  reference library  ·  WCAG-AA</text>
  </g>
</svg>
